# /etc/systemd/logind.conf.d/50-server-lid.conf
#
# A laptop used as a server must not suspend when the lid is closed: on
# battery, on mains, or docked. A drop-in file instead of editing
# /etc/systemd/logind.conf: easier to see and to undo (delete the file).
# Apply with `sudo systemctl restart systemd-logind`.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
