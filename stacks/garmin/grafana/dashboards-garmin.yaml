# Garmin module: load the Garmin dashboard into its own folder, next to
# "Server (MSI)". Mounted by stacks/garmin/compose.garmin.yaml.
apiVersion: 1

providers:
  - name: garmin
    type: file
    folder: Garmin
    # The JSON in git (generated by scripts/vendor-dashboard.py) is the source
    # of truth: edits in the UI cannot be saved over it.
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /etc/grafana/dashboards-garmin
